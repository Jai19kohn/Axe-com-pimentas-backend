services:
  postgres:
    image: postgres:17-alpine
    container_name: axe-com-pimentas-postgres
    environment:
      POSTGRES_DB: axe_com_pimentas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d axe_com_pimentas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: